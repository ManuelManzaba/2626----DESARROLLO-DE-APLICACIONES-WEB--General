{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
  <div class="p-5 mb-4 bg-light rounded-3 shadow-sm border">
    <div class="container-fluid py-3">
      <h1 class="display-5 fw-bold">Bienvenido, {{ current_user.usuario }} 👋</h1>
      <p class="col-md-8 fs-4">Has iniciado sesión correctamente en el sistema de gestión de ferretería.</p>
      <hr class="my-4">
      <p>Selecciona una opción del menú superior o accede directamente al módulo de productos:</p>
      <a class="btn btn-primary btn-lg" href="{{ url_for('productos') }}" role="button">Ir a Gestión de Productos</a>
    </div>
  </div>
</div>
{% endblock %}
