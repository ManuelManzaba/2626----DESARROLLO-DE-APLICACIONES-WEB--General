<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio Personal - Manuel Manzaba</title>
    <!-- Bootstrap 5.3 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="sticky-top">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
            <div class="container">
                <a class="navbar-brand fw-bold text-primary" href="#inicio">MM Portafolio</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="#inicio">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="#gestion-proyectos">Gestión de Proyectos</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <section id="inicio" class="hero-section shadow mb-5">
            <div class="container py-3">
                <h1 class="display-5">Portafolio Personal de Manuel Manzaba</h1>
                <p class="lead mt-3">Estudiante de la carrera de Tecnología de la Información</p>
            </div>
        </section>

        <section id="gestion-proyectos" class="bg-white p-4 rounded shadow-sm mb-5">
            <h2 class="text-primary border-bottom pb-2 mb-4">Gestión de Proyectos de TI</h2>
            
            <!-- Contenedor para Alertas -->
            <div id="alerta-container"></div>

            <form id="formulario-registro" novalidate>
                <div class="mb-3">
                    <label for="nombre" class="form-label fw-bold">Nombre del Proyecto</label>
                    <input type="text" class="form-control" id="nombre" placeholder="Ej. Portafolio Web" required>
                </div>
                <div class="mb-3">
                    <label for="categoria" class="form-label fw-bold">Categoría</label>
                    <select class="form-select" id="categoria" required>
                        <option value="" selected disabled>Seleccione una opción</option>
                        <option value="Desarrollo Web">Desarrollo Web</option>
                        <option value="Soporte Técnico">Soporte Técnico</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="descripcion" class="form-label fw-bold">Descripción</label>
                    <textarea class="form-control" id="descripcion" rows="2" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100" id="btn-guardar">
                    <span id="spinner-carga" class="spinner-border spinner-border-sm d-none me-2" role="status"></span>
                    Guardar Proyecto
                </button>
            </form>

            <div id="lista-registros" class="row g-3 mt-4"></div>
        </section>
    </main>

    <!-- Modal de Bootstrap -->
    <div class="modal fade" id="modalDetalle" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Detalle del Proyecto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="modal-contenido"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container small">
            <p>Estudiante: Manuel Manzaba | 2026</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
